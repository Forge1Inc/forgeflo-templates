name: validate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-registry.mjs --check --require-screenshots
      - name: No API keys anywhere (imports included)
        run: |
          if grep -rE "AIza[0-9A-Za-z_-]{35}|sk_live_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]{20,}" --include="*.html" --include="*.js" --include="*.css" .; then
            echo "Secret-looking string found — scrub before committing"; exit 1
          fi
